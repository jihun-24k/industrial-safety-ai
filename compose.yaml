name: industrial-safety-stack

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sql_db
      MARIADB_USER: safety
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    ports:
      - "127.0.0.1:${DB_PORT:-53301}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  auth:
    build: ./workplace
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/sql_db
      DB_USER: safety
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/login", "-o", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  rag:
    build:
      context: .
      dockerfile: rag-code-template_ext/Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the root .env}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      DB_HOST: mariadb
      DB_USER: safety
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      DB_NAME: sql_db
      AUTH_CHECK_URL: http://auth:8080/api/auth/check
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:${RAG_PORT:-8001}:8001"
    volumes:
      - ./rag-code-template_ext/faiss_db:/app/rag-code-template_ext/faiss_db
      - ./pipeline_artifacts:/app/pipeline_artifacts
    depends_on:
      mariadb:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  voice:
    build: ./voice-ai_code
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the root .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-4o-mini}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-nova}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      STT_ALLOWED_ORIGINS: "${STT_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}"
    ports:
      - "127.0.0.1:${VOICE_PORT:-8008}:8008"
    volumes:
      - whisper_models:/models
      - voice_uploads:/app/app/routers/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/openapi.json', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 300s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      AUTH_API_TARGET: http://auth:8080
      RAG_API_TARGET: http://rag:8001
      VOICE_API_TARGET: http://voice:8008
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      auth:
        condition: service_healthy
      rag:
        condition: service_healthy
      voice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mariadb_data:
  whisper_models:
  voice_uploads:
